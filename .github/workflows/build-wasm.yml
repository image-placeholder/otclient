name: Build WASM Client

on:
  workflow_dispatch:
  push:
    branches: [wasm]
    paths: ['wasm-patches/**', '.github/workflows/build-wasm.yml']

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repo (for patches)
        uses: actions/checkout@v4
        with:
          ref: browser
          sparse-checkout: |
            wasm-patches
            .github/workflows/build-wasm.yml
          sparse-checkout-cone-mode: false
      
      - name: Clone otclient-web
        run: git clone https://github.com/OTArchive/otclient-web.git src
      
      - name: Apply patches
        run: |
          cp wasm-patches/CMakeLists.txt src/src/CMakeLists.txt
          cp wasm-patches/shell.html src/browser/shell.html
      
      - name: Setup Emscripten
        run: |
          git clone https://github.com/emscripten-core/emsdk.git
          cd emsdk
          ./emsdk install latest
          ./emsdk activate latest
      
      - name: Build WASM
        run: |
          source emsdk/emsdk_env.sh
          cd src
          mkdir -p build-wasm
          cd build-wasm
          emcmake cmake -DWASM=ON -DCMAKE_BUILD_TYPE=Release ..
          emmake make -j$(nproc)
      
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: otclient-wasm
          path: |
            src/build-wasm/otclient.html
            src/build-wasm/otclient.js
            src/build-wasm/otclient.wasm
            src/build-wasm/otclient.data
