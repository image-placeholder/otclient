name: Build Windows 32-bit
on: workflow_dispatch
jobs:
  build:
    runs-on: windows-2022
    env:
      VCPKG_BINARY_SOURCES: "clear"
    steps:
      - name: Install v141 toolset
        run: |
          $installer = "C:/Program Files (x86)/Microsoft Visual Studio/Installer/vs_installer.exe"
          $installPath = "C:/Program Files/Microsoft Visual Studio/2022/Enterprise"
          $args = "modify --installPath `"$installPath`" --add Microsoft.VisualStudio.Component.VC.v141.x86.x64 --quiet --norestart --wait"
          $proc = Start-Process -FilePath $installer -ArgumentList $args -Wait -PassThru
          if ($proc.ExitCode -ne 0) { Write-Host "vs_installer exit code: $($proc.ExitCode)"; exit 1 }
        shell: pwsh

      - name: Clone source
        run: git clone https://github.com/matzinhozz/redemption860.git src
      
      - name: Setup vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg.git C:/vcpkg
          C:/vcpkg/bootstrap-vcpkg.bat
      
      - name: Install dependencies
        run: C:/vcpkg/vcpkg install --triplet=x86-windows --x-install-root=C:/vcpkg/installed
        working-directory: src
      
      - name: Configure
        run: |
          cd src
          cmake -B build -A Win32 -DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake -DVCPKG_TARGET_TRIPLET=x86-windows -T v141
      
      - name: Build
        run: |
          cd src
          cmake --build build --config Release
      
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: otclient-win32
          path: src/build/Release/otclient.exe
