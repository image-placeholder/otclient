name: Build Windows 32-bit
on: workflow_dispatch
jobs:
  build:
    runs-on: windows-2022
    env:
      VCPKG_BINARY_SOURCES: "clear"
    steps:
      - name: Clone source
        run: git clone https://github.com/matzinhozz/redemption860.git src
      
      - name: Setup vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg.git C:/vcpkg
          C:/vcpkg/bootstrap-vcpkg.bat
      
      - name: Install dependencies
        run: C:/vcpkg/vcpkg install --triplet=x86-windows --x-install-root=C:/vcpkg/installed
        working-directory: src
      
      - name: Configure
        run: |
          cd src
          cmake -B build -G "Visual Studio 15 2017" -A Win32 -DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake -DVCPKG_TARGET_TRIPLET=x86-windows
      
      - name: Build
        run: |
          cd src
          cmake --build build --config Release
      
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: otclient-win32
          path: src/build/Release/otclient.exe
