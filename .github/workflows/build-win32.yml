name: Build Windows 32-bit (Win7 / 10 / 11)

on: workflow_dispatch

env:
  # What gets built. Pin SRC_REF to a commit SHA for reproducible builds.
  # If you actually meant to build THIS repo, delete the clone step and use
  # `actions/checkout@v4` with `path: src` instead.
  SRC_REPO: https://github.com/matzinhozz/redemption860.git
  SRC_REF: main
  # Static CRT (/MT) + static libs: no VC++ redistributable and no UCRT update
  # (KB2999226) needed on Windows 7. Lives in vcpkg's community triplets.
  TRIPLET: x86-windows-static

jobs:
  build:
    # windows-2022 ships Visual Studio 2022 (toolset v143): C++23-capable AND
    # the last Visual Studio generation that can still target Windows 7.
    # Do NOT move this to VS 2026 / v145 (e.g. the vc18 solution): it can't.
    runs-on: windows-2022
    env:
      # Compiled dependencies are cached here, so they are built once, not every run.
      VCPKG_BINARY_SOURCES: "clear;files,C:/vcpkg-cache,readwrite"
      # Downloaded tool archives (incl. the MSYS2 packages vcpkg fetches) are
      # cached too: MSYS2 mirrors delete old package versions, so a download
      # that works today can 404 later.
      VCPKG_DOWNLOADS: C:/vcpkg-downloads

    steps:
      - name: Clone source
        shell: pwsh
        run: |
          git clone $env:SRC_REPO src
          git -C src checkout $env:SRC_REF

      - name: Restore vcpkg caches
        id: vcpkg-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            C:/vcpkg-cache
            C:/vcpkg-downloads
          # run_id makes every run save its own entry, so progress survives
          # a failed run; restore-keys pick up the most recent one.
          key: vcpkg-${{ env.TRIPLET }}-${{ hashFiles('src/vcpkg.json') }}-${{ github.run_id }}
          restore-keys: |
            vcpkg-${{ env.TRIPLET }}-${{ hashFiles('src/vcpkg.json') }}-
            vcpkg-${{ env.TRIPLET }}-

      # Use a CURRENT vcpkg checkout (full clone, not shallow). vcpkg.json's
      # "builtin-baseline" still pins every package version. Do not check out
      # the baseline commit itself: its scripts reference MSYS2 package
      # versions that no longer exist on the mirrors (404).
      - name: Set up vcpkg
        shell: pwsh
        run: |
          git clone https://github.com/microsoft/vcpkg.git C:/vcpkg
          C:/vcpkg/bootstrap-vcpkg.bat -disableMetrics

      # No separate `vcpkg install` step: the vcpkg CMake toolchain runs the
      # manifest install itself during configure (into build/vcpkg_installed),
      # so a separate step just compiled every dependency twice.
      - name: Configure
        working-directory: src
        run: >
          cmake -B build -G "Visual Studio 17 2022" -A Win32 -T host=x64
          -DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake
          -DVCPKG_TARGET_TRIPLET=${{ env.TRIPLET }}
          -DVCPKG_HOST_TRIPLET=x64-windows
          -DBUILD_STATIC_LIBRARY=ON

      - name: Build
        working-directory: src
        run: cmake --build build --config Release --parallel

      # The project writes otclient.exe to the SOURCE dir by default
      # (RUNTIME_OUTPUT_DIRECTORY = CMAKE_SOURCE_DIR), not build/Release,
      # so search for it instead of hard-coding a path.
      - name: Collect artifact
        shell: pwsh
        run: |
          $exe = Get-ChildItem src -Recurse -Filter otclient.exe |
                 Where-Object { $_.FullName -notmatch 'vcpkg_installed|CMakeFiles' } |
                 Select-Object -First 1
          if (-not $exe) { Write-Error "otclient.exe not found"; exit 1 }
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          Copy-Item $exe.FullName artifacts
          Get-ChildItem $exe.Directory.FullName -Filter *.dll -ErrorAction SilentlyContinue |
            Copy-Item -Destination artifacts
          Get-ChildItem artifacts

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: otclient-win32
          path: artifacts

      # Runs even when the build failed, so a long first run isn't wasted.
      - name: Save vcpkg caches
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            C:/vcpkg-cache
            C:/vcpkg-downloads
          key: ${{ steps.vcpkg-cache.outputs.cache-primary-key }}
