name: Build - Emscripten

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "src/**"
      - ".github/workflows/build-emscripten.yml"
  push:
    paths:
      - "src/**"
      - ".github/workflows/build-emscripten.yml"
    branches:
      - main

jobs:
  cancel-runs:
    if: github.event_name == 'pull_request' && github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Cancel Previous Runs
        uses: styfle/cancel-workflow-action@main
        with:
          access_token: ${{ github.token }}

  build:
    name: ${{ matrix.buildtype }}
    runs-on: ubuntu-latest

    concurrency:
      group: otclient-emscripten-${{ github.workflow }}-${{ github.ref }}-${{ matrix.buildtype }}
      cancel-in-progress: true

    env:
      VCPKG_BINARY_SOURCES: "clear"

    strategy:
      fail-fast: false
      matrix:
        buildtype: [emscripten-release]
        include:
          - buildtype: emscripten-release
            cmake_build_type: Release

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Clone upstream source (known-good)
        run: |
          rm -rf /tmp/upstream
          git clone https://github.com/OTArchive/otclient-web.git /tmp/upstream
          git -C /tmp/upstream checkout 4055623e29e3565b0b48c0bcf5a42c6d67c0090f
          cp -r /tmp/upstream/src/* ${{ github.workspace }}/src/
          cp -r /tmp/upstream/data ${{ github.workspace }}/ 2>/dev/null || true
          cp -r /tmp/upstream/modules ${{ github.workspace }}/ 2>/dev/null || true
          cp -r /tmp/upstream/mods ${{ github.workspace }}/ 2>/dev/null || true
          cp /tmp/upstream/otclientrc.lua ${{ github.workspace }}/ 2>/dev/null || true
          cp /tmp/upstream/init.lua ${{ github.workspace }}/ 2>/dev/null || true

      - name: Apply our patches
        run: |
          # Clean patch: 512MB fixed, -O3, no thread limit
          F=${{ github.workspace }}/src/CMakeLists.txt
          # Ensure -O3 (not -Os)
          sed -i 's/-Os/-O3/g' $F
          # 512MB fixed memory (add if missing)
          if grep -q 'sINITIAL_MEMORY=' $F; then
            sed -i 's/-sINITIAL_MEMORY=[0-9]*/-sINITIAL_MEMORY=536870912/g' $F
          else
            sed -i 's/-sALLOW_MEMORY_GROWTH=1/-sINITIAL_MEMORY=536870912 -sALLOW_MEMORY_GROWTH=0/' $F
          fi
          sed -i 's/-sMAXIMUM_MEMORY=[0-9]*//g' $F
          # Ensure no growth
          sed -i 's/-sALLOW_MEMORY_GROWTH=1/-sALLOW_MEMORY_GROWTH=0/g' $F
          echo "Patched:"
          grep -o '\-sINITIAL_MEMORY=[0-9]*' $F | head -1
          grep -o '\-sALLOW_MEMORY_GROWTH=[01]' $F | head -1

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: "3.1.73"

      - name: Get vcpkg commit ID
        id: vcpkg-step
        run: |
          vcpkgCommitId=$(grep '.builtin-baseline' vcpkg.json | awk -F: '{print $2}' | tr -d '," ')
          echo "vcpkgGitCommitId=$vcpkgCommitId" >> $GITHUB_OUTPUT

      - name: Cache full vcpkg artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/vcpkg/archives
            ${{ github.workspace }}/vcpkg/installed
            ${{ github.workspace }}/vcpkg/buildtrees
            ${{ github.workspace }}/vcpkg/downloads
          key: vcpkg-${{ matrix.buildtype }}-${{ steps.hash.outputs.hash }}
          restore-keys: |
            vcpkg-${{ matrix.buildtype }}-

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: ${{ steps.vcpkg-step.outputs.vcpkgGitCommitId }}

      - name: Install CMake and Ninja
        uses: lukka/get-cmake@v3.31.6

      - name: Compute vcpkg hash
        id: hash
        run: echo "hash=$(sha256sum vcpkg.json | cut -d' ' -f1)" >> $GITHUB_OUTPUT

      - name: Configure CMake
        run: |
          cmake -G Ninja -S . -B build-${{ matrix.buildtype }} \
            -DVCPKG_CHAINLOAD_TOOLCHAIN_FILE=$EMSDK/upstream/emscripten/cmake/Modules/Platform/Emscripten.cmake \
            -DCMAKE_TOOLCHAIN_FILE=$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake \
            -DVCPKG_TARGET_TRIPLET=wasm32-emscripten \
            -DVCPKG_OVERLAY_PORTS=${{ github.workspace }}/browser/overlay-ports \
            -DVCPKG_BUILD_TYPE=${{ matrix.cmake_build_type }} \
            -DCMAKE_MAKE_PROGRAM=ninja \
            -DOPTIONS_ENABLE_IPO=OFF \
            -DTOGGLE_BIN_FOLDER=ON \
            -DCMAKE_BUILD_TYPE=${{ matrix.cmake_build_type }} \
            -DTOGGLE_BOT_PROTECTION=OFF

      - name: Build
        run: |
          cmake --build ${{ github.workspace }}/build-${{ matrix.buildtype }} --target otclient

      - name: Create and Upload Artifact
        if: ${{ github.event_name != 'pull_request' }}
        uses: actions/upload-artifact@v4
        with:
          name: otclient-${{ matrix.buildtype }}-${{ github.sha }}
          path: ${{ github.workspace }}/build-${{ matrix.buildtype }}/bin/
          retention-days: 30
