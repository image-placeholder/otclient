name: Build - Emscripten

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "src/**"
      - ".github/workflows/build-emscripten.yml"
  push:
    paths:
      - "src/**"
      - ".github/workflows/build-emscripten.yml"
    branches:
      - main

jobs:
  cancel-runs:
    if: github.event_name == 'pull_request' && github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Cancel Previous Runs
        uses: styfle/cancel-workflow-action@main
        with:
          access_token: ${{ github.token }}

  build:
    name: ${{ matrix.buildtype }}
    runs-on: ubuntu-latest

    concurrency:
      group: otclient-emscripten-${{ github.workflow }}-${{ github.ref }}-${{ matrix.buildtype }}
      cancel-in-progress: true

    env:
      VCPKG_BINARY_SOURCES: "clear"

    strategy:
      fail-fast: false
      matrix:
        buildtype: [emscripten-release]
        include:
          - buildtype: emscripten-release
            cmake_build_type: Release

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Apply our patches
        run: |
          # Patch CMakeLists in-place (preserves repo structure)
          sed -i 's/-O3/-O3/g; s/-Os/-O3/g' ${{ github.workspace }}/src/CMakeLists.txt
          # Set 256MB fixed memory (add if missing, replace if present)
          if grep -q 'sINITIAL_MEMORY=' ${{ github.workspace }}/src/CMakeLists.txt; then
            sed -i 's/-sINITIAL_MEMORY=[0-9]*/-sINITIAL_MEMORY=268435456/g' ${{ github.workspace }}/src/CMakeLists.txt
          else
            sed -i 's/-sALLOW_MEMORY_GROWTH=1/-sINITIAL_MEMORY=268435456 -sALLOW_MEMORY_GROWTH=0/' ${{ github.workspace }}/src/CMakeLists.txt
          fi
          # Limit pthread pool for iPhone (6 workers OOM)
          sed -i 's/-sPTHREAD_POOL_SIZE=navigator.hardwareConcurrency/-sPTHREAD_POOL_SIZE=2/g' ${{ github.workspace }}/src/CMakeLists.txt
          sed -i 's/-sMAXIMUM_MEMORY=[0-9]*//g; s/-sALLOW_MEMORY_GROWTH=1/-sALLOW_MEMORY_GROWTH=0/g' ${{ github.workspace }}/src/CMakeLists.txt
          # Ensure zlib in compile flags
          grep -q 'sUSE_ZLIB=1.*CMAKE_CXX_FLAGS' ${{ github.workspace }}/src/CMakeLists.txt || sed -i 's/set(CMAKE_CXX_FLAGS "${CMAKE_CXX_FLAGS} -O3/set(CMAKE_CXX_FLAGS "${CMAKE_CXX_FLAGS} -O3 -sUSE_ZLIB=1/' ${{ github.workspace }}/src/CMakeLists.txt
          cp ${{ github.workspace }}/wasm-patches/shell.html ${{ github.workspace }}/browser/shell.html

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: "3.1.73"

      - name: Get vcpkg commit ID
        id: vcpkg-step
        run: |
          vcpkgCommitId=$(grep '.builtin-baseline' vcpkg.json | awk -F: '{print $2}' | tr -d '," ')
          echo "vcpkgGitCommitId=$vcpkgCommitId" >> $GITHUB_OUTPUT

      - name: Cache full vcpkg artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/vcpkg/archives
            ${{ github.workspace }}/vcpkg/installed
            ${{ github.workspace }}/vcpkg/buildtrees
            ${{ github.workspace }}/vcpkg/downloads
          key: vcpkg-${{ matrix.buildtype }}-${{ steps.hash.outputs.hash }}
          restore-keys: |
            vcpkg-${{ matrix.buildtype }}-

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: ${{ steps.vcpkg-step.outputs.vcpkgGitCommitId }}

      - name: Install CMake and Ninja
        uses: lukka/get-cmake@v3.31.6

      - name: Compute vcpkg hash
        id: hash
        run: echo "hash=$(sha256sum vcpkg.json | cut -d' ' -f1)" >> $GITHUB_OUTPUT

      - name: Configure CMake
        run: |
          cmake -G Ninja -S . -B build-${{ matrix.buildtype }} \
            -DVCPKG_CHAINLOAD_TOOLCHAIN_FILE=$EMSDK/upstream/emscripten/cmake/Modules/Platform/Emscripten.cmake \
            -DCMAKE_TOOLCHAIN_FILE=$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake \
            -DVCPKG_TARGET_TRIPLET=wasm32-emscripten \
            -DVCPKG_OVERLAY_PORTS=${{ github.workspace }}/browser/overlay-ports \
            -DVCPKG_BUILD_TYPE=${{ matrix.cmake_build_type }} \
            -DCMAKE_MAKE_PROGRAM=ninja \
            -DOPTIONS_ENABLE_IPO=OFF \
            -DTOGGLE_BIN_FOLDER=ON \
            -DCMAKE_BUILD_TYPE=${{ matrix.cmake_build_type }} \
            -DTOGGLE_BOT_PROTECTION=OFF

      - name: Build
        run: |
          cmake --build ${{ github.workspace }}/build-${{ matrix.buildtype }} --target otclient

      - name: Create and Upload Artifact
        if: ${{ github.event_name != 'pull_request' }}
        uses: actions/upload-artifact@v4
        with:
          name: otclient-${{ matrix.buildtype }}-${{ github.sha }}
          path: ${{ github.workspace }}/build-${{ matrix.buildtype }}/bin/
          retention-days: 30
